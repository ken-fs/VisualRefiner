<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#fffaf0"/>
  <rect x="0" y="0" width="1200" height="12" fill="#d43d1f"/>

  <!-- ruler ticks -->
  <g stroke="#98a79f" stroke-width="2">
    <line x1="80" y1="86" x2="80" y2="110"/>
    <line x1="130" y1="86" x2="130" y2="102"/>
    <line x1="180" y1="86" x2="180" y2="102"/>
    <line x1="230" y1="86" x2="230" y2="110"/>
    <line x1="280" y1="86" x2="280" y2="102"/>
    <line x1="330" y1="86" x2="330" y2="102"/>
  </g>

  <!-- wordmark -->
  <g>
    <rect x="80" y="150" width="34" height="34" rx="7" fill="#17211c"/>
    <rect x="90" y="160" width="14" height="14" rx="3" fill="#f2cf52"/>
    <text x="130" y="178" font-size="34" font-weight="700" fill="#17211c">VisualRefiner</text>
  </g>

  <!-- headline -->
  <text x="78" y="300" font-size="76" font-weight="800" fill="#17211c">Make visual files</text>
  <text x="78" y="380" font-size="76" font-weight="800" fill="#17211c">behave.</text>

  <!-- subline -->
  <text x="80" y="452" font-size="30" font-weight="500" fill="#526159">Convert, compress, resize, and extract —</text>
  <text x="80" y="492" font-size="30" font-weight="500" fill="#526159">image and video, locally in your browser.</text>

  <!-- constraints chip -->
  <g>
    <rect x="80" y="530" width="470" height="52" rx="26" fill="#dce5df"/>
    <circle cx="112" cy="556" r="7" fill="#d43d1f"/>
    <text x="132" y="565" font-size="24" font-weight="600" fill="#17211c">No upload · No account · Free local tools</text>
  </g>

  <!-- inspection bench / lens motif -->
  <g>
    <rect x="770" y="150" width="360" height="330" rx="20" fill="#dce5df" stroke="#98a79f" stroke-width="2"/>
    <!-- crop ticks -->
    <g stroke="#65736c" stroke-width="4" stroke-linecap="round">
      <path d="M810 190 h-24 v24" fill="none"/>
      <path d="M1090 190 h24 v24" fill="none"/>
      <path d="M810 440 h-24 v-24" fill="none"/>
      <path d="M1090 440 h24 v-24" fill="none"/>
    </g>
    <!-- lens -->
    <circle cx="950" cy="315" r="92" fill="#fffaf0" stroke="#17211c" stroke-width="6"/>
    <circle cx="950" cy="315" r="60" fill="none" stroke="#98a79f" stroke-width="3"/>
    <line x1="1016" y1="381" x2="1070" y2="435" stroke="#d43d1f" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
